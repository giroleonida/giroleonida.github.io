<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giro Leonida - Autorização</title>
<style>
  body { font-family: system-ui, sans-serif; background: #17121f; color: #eee; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  .box { max-width: 640px; padding: 24px; background: #2a2038; border-radius: 16px; }
  code { display: block; word-break: break-all; background: #000; padding: 12px; border-radius: 8px; margin: 12px 0; }
  button { padding: 10px 18px; border-radius: 8px; border: 0; background: #e6789a; color: #fff; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <h2>Giro Leonida Publisher</h2>
  <p id="msg">Lendo a autorização...</p>
  <code id="code"></code>
  <button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copiar</button>
</div>
<script>
(function () {
  const p = new URLSearchParams(location.search);
  const code = p.get('code'), err = p.get('error');
  // Autorização iniciada pelo painel local (Giro Leonida Publisher): devolve direto para ele.
  if ((p.get('state') || '').startsWith('local-')) {
    document.getElementById('msg').textContent = 'Voltando para o Giro Leonida Publisher...';
    document.querySelector('button').style.display = 'none';
    location.replace('http://localhost:8765/tiktok/callback' + location.search);
    return;  // não mostra o código na tela
  }
  document.getElementById('msg').textContent = code
    ? 'Autorizado! Copie o código abaixo e cole no terminal do Claude:'
    : ('Erro: ' + (err || 'nenhum código recebido') + ' ' + (p.get('error_description') || ''));
  document.getElementById('code').textContent = code ? JSON.stringify({code, state: p.get('state')}) : '';
})();
</script>
</body>
</html>
